  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }\n\nbody {\n  background: #d1d5db;\n  display: flex;\n  justify-content: center;\n  align-items: flex-start;\n  min-height: 100vh;\n  padding: 32px 16px;\n  font-family: 'Mulish', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;\n}\n\n/* PHONE SHELL */\n.phone {\n  width: 390px;\n  height: 844px;\n  background: #f2f2f7;\n  border-radius: 44px;\n  overflow: hidden;\n  box-shadow: 0 30px 80px rgba(0,0,0,0.3), 0 0 0 10px #1a1a1a, 0 0 0 12px #3a3a3a;\n  position: relative;\n  display: flex;\n  flex-direction: column;\n  flex-shrink: 0;\n}\n\n/* STATUS BAR */\n.status-bar {\n  background: inherit;\n  display: flex;\n  justify-content: space-between;\n  align-items: center;\n  padding: 14px 24px 6px;\n  font-size: 12px;\n  font-weight: 600;\n  color: #111;\n  flex-shrink: 0;\n  position: relative;\n  z-index: 5;\n}\n.status-bar.dark { color: #fff; }\n.status-icons { display: flex; gap: 5px; align-items: center; }\n\n/* SCREEN WRAPPER */\n.screen-wrapper {\n  flex: 1;\n  overflow: hidden;\n  position: relative;\n}\n\n/* INDIVIDUAL SCREENS */\n.screen {\n  position: absolute;\n  inset: 0;\n  display: flex;\n  flex-direction: column;\n  opacity: 0;\n  pointer-events: none;\n  transform: translateX(30px);\n  transition: opacity 0.25s ease, transform 0.25s ease;\n}\n.screen.active {\n  opacity: 1;\n  pointer-events: all;\n  transform: translateX(0);\n}\n.screen.exit-left {\n  opacity: 0;\n  transform: translateX(-30px);\n}\n\n/* SCROLLABLE BODY */\n.scroll-body {\n  flex: 1;\n  overflow-y: auto;\n  -webkit-overflow-scrolling: touch;\n}\n.scroll-body::-webkit-scrollbar { display: none; }\n\n/* =========================================================\n   SHARED COMPONENTS\n   ========================================================= */\n\n.nav-bar {\n  background: linear-gradient(180deg, #1A1F71 0%, #1434CB 100%);\n  display: flex;\n  align-items: center;\n  justify-content: space-between;\n  padding: 40px 20px 18px;\n  border-bottom: none;\n  flex-shrink: 0;\n  z-index: 5;\n}\n.nav-title { font-size: 16px; font-weight: 700; color: #fff; letter-spacing: -0.2px; }\n.nav-bar .icon-btn { color: #fff; }\n.nav-bar .icon-btn:active { background: rgba(255,255,255,0.18); }\n#screen-dashboard .status-bar {\n  background: transparent;\n  color: #fff;\n  padding: 14px 24px 6px;\n  position: absolute; top: 0; left: 0; right: 0;\n  z-index: 10;\n}\n.icon-btn {\n  width: 36px; height: 36px;\n  display: flex; align-items: center; justify-content: center;\n  cursor: pointer; color: #1a1a2e; border-radius: 50%;\n  transition: background 0.15s;\n}\n.icon-btn:active { background: #f3f4f6; }\n\n.tab-bar {\n  background: #fff;\n  border-top: 1px solid #e8e8e8;\n  display: flex;\n  flex-shrink: 0;\n}\n.tab-item {\n  flex: 1;\n  display: flex; flex-direction: column; align-items: center;\n  padding: 10px 0 18px;\n  cursor: pointer; gap: 4px;\n  color: #9ca3af; font-size: 11px; font-weight: 500;\n  transition: color 0.2s;\n}\n.tab-item.active { color: #1A1F71; }\n.tab-item svg { width: 22px; height: 22px; }\n\n.section-header { padding: 20px 16px 8px; }\n.section-header h2 { font-size: 18px; font-weight: 700; color: #1a1a2e; margin-bottom: 3px; }\n.section-header p { font-size: 13px; color: #6b7280; }\n\n.see-all { text-align: center; padding: 10px 0 4px;\n  font-size: 13px; color: #1A1F71; font-weight: 500; cursor: pointer; }\n\n.page-footer { padding: 24px 16px 12px; text-align: center; }\n.page-footer p { font-size: 12px; color: #9ca3af; line-height: 1.8; }\n.page-footer a { color: #6b7280; text-decoration: underline; }\n\n/* =========================================================\n   SCREEN 1 — HOME BANKING\n   ================================================ ding: 40px 20px 20px;\n  background: linear-gradient(180deg, #1A1F71 0%, #1434CB 100%);\n  border-bottom: none;\n  position: relative;\n}\n.values-title { font-size: 17px; font-weight: 700; color: #fff; letter-spacing: -0.2px; }\n.values-header .icon-btn { color: #fff; }\n.values-header .icon-btn:active { background: rgba(255,255,255,0.18); }\n\n.values-intro { padding: 20px 20px 8px; }\n.values-intro h2 { font-size: 22px; font-weight: 800; color: #1a1a2e; margin-bottom: 6px; }\n.values-intro p { font-size: 14px; color: #6b7280; line-height: 1.5; }\n\n.values-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }\n.value-card {\n  background: #fff; border-radius: 14px;\n  padding: 14px 14px;\n  display: flex; align-items: center; gap: 12px;\n  cursor: pointer;\n  box-shadow: 0 3px 12px rgba(0,0,0,0.09);\n  border-left: 3px solid #d1d5db;\n  transition: transform 0.15s, box-shadow 0.15s;\n}\n.value-card:active { transform: scale(0.98); }\n.value-card.disabled { cursor: default; opacity: 0.5; }\n.value-card.disabled:active { transform: none; }\n.value-card.planet { border-left-color: #40916C; }\n.value-card.rights { border-left-color: #1A1F71; }\n.value-card.local  { border-left-color: #D4894E; }\n.value-card.culture { border-left-color: #4A8DBF; }\n.value-card.wellness { border-left-color: #15803d; }\n\n.value-icon-circle {\n  width: 44px; height: 44px; border-radius: 50%;\n  display: flex; align-items: center; justify-content: center;\n  font-size: 22px; flex-shrink: 0;\n}\n.planet .value-icon-circle { background: #E8F7F0; }\n.rights .value-icon-circle { background: #E5E8F8; }\n.local  .value-icon-circle { background: #FFF3EB; }\n.culture.value-icon-circle, .culture .value-icon-circle { background: #EBF3FA; }\n.wellness .value-icon-circle { background: #dcfce7; }\n\n.value-info { flex: 1; min-width: 0; }\n.value-name { font-size: 15px; font-weight: 700; color: #1a1a2e; line-height: 1.3; }\n.value-tags { font-size: 13.5px; color: #4b5563; marg e Human Rights<\u002Fdiv>\n        <div class=\"modal-close\" onclick=\"closeModal('modal-val-rights')\">✕<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"modal-body\">\n        <div class=\"val-modal-hero\">\n          <div class=\"val-modal-icon\" style=\"background:#E5E8F8;\">🤝<\u002Fdiv>\n          <div class=\"val-modal-name\">Promote Human Rights<\u002Fdiv>\n          <div class=\"val-modal-desc\">For people who believe their money should stand for human dignity. Supporting fair labor, fighting exploitation, and contributing to peace and justice.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"val-modal-behav-hdr\">PROMOTED BEHAVIORS<\u002Fdiv>\n        <div class=\"val-modal-tags\">\n          <span class=\"val-tag\" style=\"background:#E5E8F8;color:#0F1454;\">Donating to NGOs<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#E5E8F8;color:#0F1454;\">Buying B Corp brands<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#E5E8F8;color:#0F1454;\">Fair Trade purchases<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#E5E8F8;color:#0F1454;\">Ethical fashion<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#E5E8F8;color:#0F1454;\">Avoiding flagged merchants<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#E5E8F8;color:#0F1454;\">Supporting cooperatives<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Local -->\n  <div class=\"modal-overlay\" id=\"modal-val-local\" onclick=\"handleOverlayClick(event, 'modal-val-local')\">\n    <div class=\"modal-sheet\">\n      <div class=\"modal-drag\"><\u002Fdiv>\n      <div class=\"modal-header\">\n        <div class=\"modal-title\" style=\"color:#D4894E;\">Support Local Economy<\u002Fdiv>\n        <div class=\"modal-close\" onclick=\"closeModal('modal-val-local')\">✕<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"modal-body\">\n        <div class=\"val-modal-hero\">\n          <div class=\"val-modal-icon\" style=\"background:#FFF3EB;\">🏪<\u002Fdiv>\n          <div class=\"val-modal-name\">Support Local Economy<\u002Fdiv>\n          <div class=\"val-modal-desc\">For people who want their money to stay in their community. Supporting the small shop, the family restaurant, the independent craftsman.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"val-modal-behav-hdr\">PROMOTED BEHAVIORS<\u002Fdiv>\n        <div class=\"val-modal-tags\">\n          <span class=\"val-tag\" style=\"background:#FFF3EB;color:#a3622a;\">Independent restaurants &amp; cafes<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#FFF3EB;color:#a3622a;\">Farmers markets<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#FFF3EB;color:#a3622a;\">Small neighborhood shops<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#FFF3EB;color:#a3622a;\">Local artisans &amp; craftsmen<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#FFF3EB;color:#a3622a;\">Non-chain retail<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Culture -->\n  <div class=\"modal-overlay\" id=\"modal-val-culture\" onclick=\"handleOverlayClick(event, 'modal-val-culture')\">\n    <div class=\"modal-sheet\">\n      <div class=\"modal-drag\"><\u002Fdiv>\n      <div class=\"modal-header\">\n        <div class=\"modal-title\" style=\"color:#4A8DBF;\">Promote Culture &amp; Knowledge<\u002Fdiv>\n        <div class=\"modal-close\" onclick=\"closeModal('modal-val-culture')\">✕<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"modal-body\">\n        <div class=\"val-modal-hero\">\n          <div class=\"val-modal-icon\" style=\"background:#EBF3FA;\">📚<\u002Fdiv>\n          <div class=\"val-modal-name\">Promote Culture &amp; Knowledge<\u002Fdiv>\n          <div class=\"val-modal-desc\">For people who invest in ideas, creativity, and learning. Every ticket, subscription, and purchase is a vote for curiosity and creativity.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"val-modal-behav-hdr\">PROMOTED BEHAVIORS<\u002Fdiv>\n        <div class=\"val-modal-tags\">\n          <span class=\"val-tag\" style=\"background:#EBF3FA;color:#2e6b9e;\">Museums &amp; galleries<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#EBF3FA;color:#2e6b9e;\">Theater &amp; performing arts<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#EBF3FA;color:#2e6b9e;\">Buying books<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#EBF3FA;color:#2e6b9e;\">Online courses<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#EBF3FA;color:#2e6b9e;\">Music &amp; instruments<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#EBF3FA;color:#2e6b9e;\">Creative workshops<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- Wellness -->\n  <div class=\"modal-overlay\" id=\"modal-val-wellness\" onclick=\"handleOverlayClick(event, 'modal-val-wellness')\">\n    <div class=\"modal-sheet\">\n      <div class=\"modal-drag\"><\u002Fdiv>\n      <div class=\"modal-header\">\n        <div class=\"modal-title\" style=\"color:#22A86B;\">Health &amp; Wellness<\u002Fdiv>\n        <div class=\"modal-close\" onclick=\"closeModal('modal-val-wellness')\">✕<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"modal-body\">\n        <div class=\"val-modal-hero\">\n          <div class=\"val-modal-icon\" style=\"background:#E8F8EF;\">💪<\u002Fdiv>\n          <div class=\"val-modal-name\">Health &amp; Wellness<\u002Fdiv>\n          <div class=\"val-modal-desc\">For people who invest in their physical and mental well-being. Your spending at gyms, organic stores, and wellness services reflects your commitment to a healthy lifestyle.<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"val-modal-behav-hdr\">PROMOTED BEHAVIORS<\u002Fdiv>\n        <div class=\"val-modal-tags\">\n          <span class=\"val-tag\" style=\"background:#E8F8EF;color:#15803d;\">Gym memberships<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#E8F8EF;color:#15803d;\">Organic food<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#E8F8EF;color:#15803d;\">Yoga &amp; meditation<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#E8F8EF;color:#15803d;\">Sports activities<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#E8F8EF;color:#15803d;\">Health supplements<\u002Fspan>\n          <span class=\"val-tag\" style=\"background:#E8F8EF;color:#15803d;\">Wellness retreats<\u002Fspan>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- =====================================================\n       MODAL 1: TRANSACTION INSIGHT DETAIL\n       ===================================================== -->\n  <div class=\"modal-overlay\" id=\"modal-insight\" onclick=\"handleOverlayClick(event, 'modal-insight')\">\n    <div class=\"modal-sheet\">\n      <div class=\"modal-drag\"><\u002Fdiv>\n      <div class=\"modal-header\">\n        <div class=\"modal-title\" id=\"insight-modal-title\">Insight Detail<\u002Fdiv>\n        <div class=\"modal-close\" onclick=\"closeModal('modal-insight')\">✕<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"modal-body\">\n        <div class=\"insight-modal-icon\" id=\"insight-modal-icon\" style=\"background:#dcfce7;\">✓<\u002Fdiv>\n        <div class=\"insight-modal-text\" id=\"insight-modal-text\"><\u002Fdiv>\n      <\u002Fdiv>\n      <button class=\"modal-got-it\" onclick=\"closeModal('modal-insight')\">Got it<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- =====================================================\n       MODAL 2: SCORE METHODOLOGY\n       ===================================================== -->\n  <div class=\"modal-overlay\" id=\"modal-methodology\" onclick=\"handleOverlayClick(event, 'modal-methodology')\">\n    <div class=\"modal-sheet\">\n      <div class=\"modal-drag\"><\u002Fdiv>\n      <div class=\"modal-header\">\n        <div class=\"modal-title\">How your score works<\u002Fdiv>\n        <div class=\"modal-close\" onclick=\"closeModal('modal-methodology')\">✕<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"modal-body\">\n        <p style=\"font-size:13px;color:#6b7280;line-height:1.5;margin-bottom:4px;\">Your Human Rights Impact Score (0–100) measures how consistently your spending promotes human dignity and fair labor.<\u002Fp>\n\n        <div class=\"meth-section-title\">WHAT EARNS POINTS<\u002Fdiv>\n        <div class=\"meth-row\"><div class=\"meth-check\">✅<\u002Fdiv><div class=\"meth-label\">Purchases at <strong>Fair Trade certified<\u002Fstrong> merchants<\u002Fdiv><\u002Fdiv>\n        <div class=\"meth-row\"><div class=\"meth-check\">✅<\u002Fdiv><div class=\"meth-label\">Shopping at <strong>B Corp certified<\u002Fstrong> brands<\u002Fdiv><\u002Fdiv>\n        <div class=\"meth-row\"><div class=\"meth-check\">✅<\u002Fdiv><div class=\"meth-label\">Donations to <strong>human rights organizations<\u002Fstrong> (NGOs)<\u002Fdiv><\u002Fdiv>\n        <div class=\"meth-row\"><div class=\"meth-check\">✅<\u002Fdiv><div class=\"meth-label\">Purchases at merchants with <strong>SA8000 certification<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n        <div class=\"meth-row\"><div class=\"meth-check\">✅<\u002Fdiv><div class=\"meth-label\">Ethical spend <strong>above your community average<\u002Fstrong><\u002Fdiv><\u002Fdiv>\n\n        <div class=\"meth-section-title\" style=\"margin-top:16px;\">WHAT TO WATCH OUT FOR<\u002Fdiv>\n        <div class=\"meth-row\"><div class=\"meth-check\">⚠️<\u002Fdiv><div class=\"meth-label\">Merchants with <strong>open labor violation flags<\u002Fstrong> are negative signals<\u002Fdiv><\u002Fdiv>\n        <div class=\"meth-row\"><div class=\"meth-check\">⚠️<\u002Fdiv><div class=\"meth-label\">Brands under <strong>active supply chain audits<\u002Fstrong> may reduce your score<\u002Fdiv><\u002Fdiv>\n\n        <div class=\"meth-section-title\" style=\"margin-top:16px;\">SCORE TIERS<\u002Fdiv>\n        <div class=\"tier-row\" style=\"background:#f9fafb;\">\n          <div class=\"tier-pill t-start\">Getting Started<\u002Fdiv>\n          <div class=\"tier-desc\">0 – 40 pts &nbsp;·&nbsp; Begin your journey<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tier-row\" style=\"background:#fefdf5;\">\n          <div class=\"tier-pill t-bronze\">Bronze<\u002Fdiv>\n          <div class=\"tier-desc\">41 – 70 pts &nbsp;·&nbsp; Growing awareness<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tier-row\" style=\"background:#f8fafc;\">\n          <div class=\"tier-pill t-silver\">Silver<\u002Fdiv>\n          <div class=\"tier-desc\">71 – 85 pts &nbsp;·&nbsp; Consistent impact<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"tier-row\" style=\"background:#fefce8;\">\n          <div class=\"tier-pill t-gold\">Gold ⭐<\u002Fdiv>\n          <div class=\"tier-desc\">86 – 100 pts &nbsp;·&nbsp; Values champion<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:11px;color:#9ca3af;margin-top:12px;line-height:1.5;\">Scores are recalculated monthly. Data provided by Clarity AI based on merchant-level sustainability analysis.<\u002Fp>\n      <\u002Fdiv>\n      <button class=\"modal-got-it\" onclick=\"closeModal('modal-methodology')\">Got it<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <!-- =====================================================\n       MODAL 3: CONTRIBUTING TRANSACTIONS\n       ===================================================== -->\n  <div class=\"modal-overlay\" id=\"modal-transactions\" onclick=\"handleOverlayClick(event, 'modal-transactions')\">\n    <div class=\"modal-sheet\">\n      <div class=\"modal-drag\"><\u002Fdiv>\n      <div class=\"modal-header\">\n        <div class=\"modal-title\">Transactions contributing to your score<\u002Fdiv>\n        <div class=\"modal-close\" onclick=\"closeModal('modal-transactions')\">✕<\u002Fdiv>\n      <\u002Fdiv>\n      <div class=\"modal-body\">\n        <div class=\"txn-summary-pill\">\n          <span>🏆<\u002Fspan> 7 transactions contributed 43 pts this month\n        <\u002Fdiv>\n        <div class=\"modal-txn-row\">\n          <div class=\"mtxn-icon\">🌿<\u002Fdiv>\n          <div class=\"mtxn-info\"><div class=\"mtxn-name\">People Tree<\u002Fdiv><div class=\"mtxn-cat\">Fair Trade Fashion<\u002Fdiv><\u002Fdiv>\n          <div class=\"mtxn-pts pts-pos\">+5 pts<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"modal-txn-row\">\n          <div class=\"mtxn-icon\">🛒<\u002Fdiv>\n          <div class=\"mtxn-info\"><div class=\"mtxn-name\">Carrefour<\u002Fdiv><div class=\"mtxn-cat\">Supermarket<\u002Fdiv><\u002Fdiv>\n          <div class=\"mtxn-pts pts-none\">No pts<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"modal-txn-row\">\n          <div class=\"mtxn-icon\">🤝<\u002Fdiv>\n          <div class=\"mtxn-info\"><div class=\"mtxn-name\">Oxfam Shop<\u002Fdiv><div class=\"mtxn-cat\">Fair Trade Retail<\u002Fdiv><\u002Fdiv>\n          <div class=\"mtxn-pts pts-pos\">+5 pts<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"modal-txn-row\">\n          <div class=\"mtxn-icon\">🇺🇳<\u002Fdiv>\n          <div class=\"mtxn-info\"><div class=\"mtxn-name\">UNHCR Donation<\u002Fdiv><div class=\"mtxn-cat\">Human Rights NGO<\u002Fdiv><\u002Fdiv>\n          <div class=\"mtxn-pts pts-pos\">+10 pts<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"modal-txn-row\">\n          <div class=\"mtxn-icon\">👕<\u002Fdiv>\n          <div class=\"mtxn-info\"><div class=\"mtxn-name\">Shein<\u002Fdiv><div class=\"mtxn-cat\">Fast Fashion<\u002Fdiv><\u002Fdiv>\n          <div class=\"mtxn-pts pts-none\">No pts<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"modal-txn-row\">\n          <div class=\"mtxn-icon\">🏔️<\u002Fdiv>\n          <div class=\"mtxn-info\"><div class=\"mtxn-name\">Patagonia<\u002Fdiv><div class=\"mtxn-cat\">B Corp Certified<\u002Fdiv><\u002Fdiv>\n          <div class=\"mtxn-pts pts-pos\">+8 pts<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"modal-txn-row\">\n          <div class=\"mtxn-icon\">✊<\u002Fdiv>\n          <div class=\"mtxn-info\"><div class=\"mtxn-name\">Amnesty International<\u002Fdiv><div class=\"mtxn-cat\">Human Rights NGO<\u002Fdiv><\u002Fdiv>\n          <div class=\"mtxn-pts pts-pos\">+10 pts<\u002Fdiv>\n        <\u002Fdiv>\n        <div class=\"modal-txn-row\">\n          <div class=\"mtxn-icon\">👗<\u002Fdiv>\n          <div class=\"mtxn-info\"><div class=\"mtxn-name\">Zara<\u002Fdiv><div class=\"mtxn-cat\">Fashion — labor flag ⚠️<\u002Fdiv><\u002Fdiv>\n          <div class=\"mtxn-pts pts-none\">No pts<\u002Fdiv>\n        <\u002Fdiv>\n        <p style=\"font-size:11px;color:#9ca3af;margin-top:14px;line-height:1.5;\">Only transactions at certified or verified merchants generate points. Data updated daily by Clarity AI.<\u002Fp>\n      <\u002Fdiv>\n      <button class=\"modal-got-it\" onclick=\"closeModal('modal-transactions')\">Got it<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv><!-- /phone -->\n\n<script>\n  // ---- SCREEN NAVIGATION ----\n  let currentScreen = 'screen-home';\n  let selectedValue = 'rights';\n  let communitiesOnboarded = false;\n  // Communities onboarding only persists within a session, not across reloads\n  try { sessionStorage.getItem('communitiesOnboarded') === '1' && (communitiesOnboarded = true); } catch(e){}\n\n  function valSuffix(val) {\n    if (val === 'wellness') return 'hw';\n    if (val === 'rights') return 'hr';\n    return 'hr';\n  }\n\n  function goTo(id) {\n    const from = document.getElementById(currentScreen);\n    const to   = document.getElementById(id);\n    if (!to || id === currentScreen) return;\n\n    from.classList.add('exit-left');\n    to.classList.add('active');\n\n    setTimeout(() => {\n      from.classList.remove('active', 'exit-left');\n    }, 260);\n\n    currentScreen = id;\n\n    // Reset scroll\n    const scroll = to.querySelector('.scroll-body');\n    if (scroll) scroll.scrollTop = 0;\n\n    // Always show the Fine Dining onboarding when entering this screen\n    if (id === 'screen-finedining') {\n      to.classList.remove('fd-joined');\n    }\n\n    // When entering dashboard, initialize to My Impact tab for selected value\n    if (id === 'screen-dashboard') {\n      document.querySelectorAll('#dash-scroll .sub-screen').forEach(s => s.classList.remove('active'));\n      document.getElementById('sub-myimpact-' + valSuffix(selectedValue)).classList.add('active');\n      document.querySelectorAll('#screen-dashboard .tab-item').forEach(t => t.classList.remove('active'));\n      document.getElementById('tab-myimpact').classList.add('active');\n      document.getElementById('dash-scroll').scrollTop = 0;\n    }\n  }\n\n  // ---- VALUE ENTRY (hub model) ----\n  function enterValue(val) {\n    selectedValue = val;\n    goTo('screen-dashboard');\n  }\n\n  // ---- DASHBOARD TABS ----\n  function switchDashTab(tab, el) {\n    document.querySelectorAll('#screen-dashboard .tab-item').forEach(t => t.classList.remove('active'));\n    el.classList.add('active');\n    document.querySelectorAll('#dash-scroll .sub-screen').forEach(s => s.classList.remove('active'));\n    if (tab === 'communities') {\n      if (!communitiesOnboarded) {\n        document.getElementById('sub-communities-onb').classList.add('active');\n      } else {\n        document.getElementById('sub-communities-' + valSuffix(selectedValue)).classList.add('active');\n      }\n    } else {\n      document.getElementById('sub-' + tab + '-' + valSuffix(selectedValue)).classList.add('active');\n    }\n    document.getElementById('dash-scroll').scrollTop = 0;\n  }\n\n  // ---- COMMUNITIES ONBOARDING ----\n  function completeCommunitiesOnboarding() {\n    communitiesOnboarded = true;\n    try { sessionStorage.setItem('communitiesOnboarded', '1'); } catch(e){}\n    document.querySelectorAll('#dash-scroll .sub-screen').forEach(s => s.classList.remove('active'));\n    document.getElementById('sub-communities-' + valSuffix(selectedValue)).classList.add('active');\n    document.getElementById('dash-scroll').scrollTop = 0;\n  }\n\n  // ---- JOIN TOGGLE ----\n  function toggleJoin(btn) {\n    if (btn.classList.contains('joined')) {\n      btn.classList.remove('joined');\n      btn.textContent = 'Join';\n    } else {\n      btn.classList.add('joined');\n      btn.textContent = '✓ Joined';\n    }\n  }\n\n  // ---- FINE DINING: jump to a Dashboard tab from inside the community ----\n  window.goToDashTab = function(tab) {\n    document.getElementById('screen-finedining').classList.remove('fd-joined');\n    goTo('screen-dashboard');\n    setTimeout(() => {\n      const el = document.getElementById('tab-' + tab);\n      if (el && typeof switchDashTab === 'function') switchDashTab(tab, el);\n    }, 30);\n  };\n  function switchFDTab(tab, el) {\n    document.querySelectorAll('#screen-finedining .fd-tab-item').forEach(t => t.classList.remove('active'));\n    if (el) el.classList.add('active');\n    document.querySelectorAll('#screen-finedining .fd-sub-screen').forEach(s => s.classList.remove('active'));\n    document.getElementById('fd-sub-' + tab).classList.add('active');\n    document.getElementById('fd-scroll').scrollTop = 0;\n  }\n\n  // ---- FINE DINING ONBOARDING ----\n  function fdJoin() {\n    document.getElementById('screen-finedining').classList.add('fd-joined');\n    // Note: onboarding is always shown on entering this screen — joining only hides the overlay for the current visit.\n  }\n  function fdResetOnboarding() {\n    try { localStorage.removeItem('fdJoined'); } catch(e){}\n    document.getElementById('screen-finedining').classList.remove('fd-joined');\n  }\n  window.fdResetOnboarding = fdResetOnboarding;\n  // Allow ?fdreset to clear stored state\n  try {\n    if (location.search.indexOf('fdreset') !== -1) {\n      localStorage.removeItem('fdJoined');\n    }\n  } catch(e){}\n  // Onboarding always shows on entering this screen — do not restore from storage.\n  try { localStorage.removeItem('fdJoined'); } catch(e){}\n\n  function goBackFromFineDining() {\n    const from = document.getElementById('screen-finedining');\n    const to = document.getElementById('screen-dashboard');\n    // Reset onboarding so it shows again next time the user enters this community.\n    from.classList.remove('fd-joined');\n    from.classList.add('exit-left');\n    to.classList.add('active');\n    setTimeout(() => { from.classList.remove('active', 'exit-left'); }, 260);\n    currentScreen = 'screen-dashboard';\n    // Reactivate communities tab\n    document.querySelectorAll('#screen-dashboard .tab-item').forEach(t => t.classList.remove('active'));\n    document.getElementById('tab-communities').classList.add('active');\n    document.querySelectorAll('#dash-scroll .sub-screen').forEach(s => s.classList.remove('active'));\n    if (communitiesOnboarded) {\n      document.getElementById('sub-communities-' + valSuffix(selectedValue)).classList.add('active');\n    } else {\n      document.getElementById('sub-communities-onb').classList.add('active');\n    }\n    // Reset FD to My Club tab\n    document.querySelectorAll('#screen-finedining .fd-tab-item').forEach(t => t.classList.remove('active'));\n    { const _t = document.getElementById('fd-tab-myclub'); if (_t) _t.classList.add('active'); }\n    document.querySelectorAll('#screen-finedining .fd-sub-screen').forEach(s => s.classList.remove('active'));\n    document.getElementById('fd-sub-myclub').classList.add('active');\n  }\n\n  // ---- MERCHANT TABS ----\n  document.querySelectorAll('.m-tab').forEach(tab => {\n    tab.addEventListener('click', function() {\n      document.querySelectorAll('.m-tab').forEach(t => t.classList.remove('active'));\n      this.classList.add('active');\n    });\n  });\n  document.querySelectorAll('.fd-m-tab').forEach(tab => {\n    tab.addEventListener('click', function() {\n      const group = this.parentElement;\n      group.querySelectorAll('.fd-m-tab').forEach(t => t.classList.remove('active'));\n      this.classList.add('active');\n      const key = this.getAttribute('data-fd-mtab');\n      if (key) {\n        document.querySelectorAll('.fd-mtab-panel').forEach(p => {\n          const match = p.getAttribute('data-fd-mpanel') === key;\n          p.classList.toggle('active', match);\n          p.style.display = match ? '' : 'none';\n        });\n      }\n    });\n  });\n\n  // ---- MYTH BUSTER ----\n  const myths = [\n    { text: '\"Ethical fashion\" always costs more.', bust: 'Price is not a proxy for ethics. Some mid-range brands pay living wages while some luxury labels cut corners. Certifications like Fair Trade, SA8000, and B Corp are better signals.' },\n    { text: '\"Made in Italy\" (or UK, USA, France) means fair labor conditions.', bust: 'Country-of-origin labels only indicate where final assembly happened. Many garments use components from countries with minimal labor protections — with no transparency required.' },\n    { text: 'Buying from big brands means workers are better protected.', bust: 'Large brands often subcontract to third parties with little oversight. Labor violations are more common in tier-2 and tier-3 suppliers — and brands rarely audit that far.' },\n    { text: 'Donating to charities compensates for buying from unethical brands.', bust: 'Charitable giving is valuable, but does not offset systemic harm from exploitative supply chains. Reducing demand from harmful brands is more impactful than offsetting it.' }\n  ];\n  let mythIdx = 0;\n  let mythBusted = false;\n\n  function bustMyth() {\n    const r = document.getElementById('myth-reveal');\n    const b = document.querySelector('.bust-btn');\n    mythBusted = !mythBusted;\n    r.classList.toggle('show', mythBusted);\n    b.textContent = mythBusted ? 'Hide explanation' : 'Bust it';\n  }\n\n  function changeMyth(dir) {\n    mythIdx = (mythIdx + dir + myths.length) % myths.length;\n    document.getElementById('myth-text').textContent = myths[mythIdx].text;\n    document.getElementById('myth-reveal').textContent = myths[mythIdx].bust;\n    document.getElementById('myth-reveal').classList.remove('show');\n    document.getElementById('myth-count').textContent = (mythIdx + 1) + ' / ' + myths.length;\n    document.querySelector('.bust-btn').textContent = 'Bust it';\n    mythBusted = false;\n  }\n\n  // ---- HW MYTH BUSTER ----\n  let mythBustedHW = false;\n  function bustMythHW() {\n    const r = document.getElementById('myth-reveal-hw');\n    mythBustedHW = !mythBustedHW;\n    r.classList.toggle('show', mythBustedHW);\n  }\n\n  // ---- VALUE DETAIL MODALS ----\n  function openValueModal(val) {\n    openModal('modal-val-' + val);\n  }\n\n  // ---- DRAG-TO-SCROLL (mouse) ----\n  function addDragScroll(el) {\n    let isDown = false, startX, scrollLeft;\n    el.addEventListener('mousedown', e => {\n      isDown = true; el.classList.add('dragging');\n      startX = e.pageX - el.offsetLeft; scrollLeft = el.scrollLeft;\n    });\n    el.addEventListener('mouseleave', () => { isDown = false; el.classList.remove('dragging'); });\n    el.addEventListener('mouseup', () => { isDown = false; el.classList.remove('dragging'); });\n    el.addEventListener('mousemove', e => {\n      if (!isDown) return; e.preventDefault();\n      const x = e.pageX - el.offsetLeft;\n      el.scrollLeft = scrollLeft - (x - startX);\n    });\n  }\n  document.querySelectorAll('.articles-scroll, .merchant-scroll, .accounts-carousel, .h-scroll').forEach(addDragScroll);\n\n  // ---- MODALS ----\n  function openModal(id) {\n    const el = document.getElementById(id);\n    if (el) { el.classList.add('open'); }\n  }\n  function closeModal(id) {\n    const el = document.getElementById(id);\n    if (el) { el.classList.remove('open'); }\n  }\n  function handleOverlayClick(e, id) {\n    if (e.target === e.currentTarget) closeModal(id);\n  }\n\n  // ---- INSIGHT MODAL DATA ----\n  const insightData = [\n    {\n      title: 'Fair Trade Purchases',\n      icon: '✓', bg: '#dcfce7',\n      text: 'Out of your 25 purchases this month, 5 were at Fair Trade certified merchants (20%). Top merchants: Oxfam Shop, People Tree, and Equal Exchange. Keep it up — Fair Trade purchases are one of the highest-scoring actions.'\n    },\n    {\n      title: 'Ethical Spending vs. Average',\n      icon: '↗', bg: '#ccfbf1',\n      text: 'Your ethical spend share is 34% of total spending this month, compared to the community average of 22%. You\\'re performing in the top 15% of your community. Ethical spend includes Fair Trade, B Corp, and NGO donations.'\n    },\n    {\n      title: 'Merchants with Labor Flags',\n      icon: '⚠', bg: '#fef9c3',\n      text: '2 merchants you shopped at this month have open labor concern flags: Zara (supply chain audit pending) and Shein (ongoing labor investigation). Consider alternatives like People Tree or The Giving Movement for similar products.'\n    },\n    {\n      title: 'B Corp Certified Brands',\n      icon: '★', bg: '#ede9fe',\n      text: '3 of your regular brands are B Corp certified: Patagonia, The Body Shop, and The Giving Movement. B Corp certification requires verified high standards of social and environmental performance, accountability, and transparency.'\n    },\n    {\n      title: 'Donations to Human Rights Orgs',\n      icon: '♥', bg: '#fce7f3',\n      text: 'You donated to 2 human rights organizations this quarter: Amnesty International (AED 50) and UNHCR (AED 30). That\\'s AED 80 in direct impact — and each donation also earns you points toward your score.'\n    }\n  ];\n\n  function openInsightModal(idx) {\n    const data = insightData[idx];\n    document.getElementById('insight-modal-title').textContent = data.title;\n    document.getElementById('insight-modal-icon').textContent = data.icon;\n    document.getElementById('insight-modal-icon').style.background = data.bg;\n    document.getElementById('insight-modal-text').textContent = data.text;\n    openModal('modal-insight');\n  }\n<\u002Fscript>\n\n<!-- ============= TWEAKS PANEL ============= -->\n<div class=\"tw-panel\" id=\"tw-panel\">\n  <div class=\"tw-panel-head\">\n    <div class=\"tw-panel-title\">Tweaks<\u002Fdiv>\n    <button class=\"tw-panel-close\" onclick=\"twClose()\" aria-label=\"Close\">×<\u002Fbutton>\n  <\u002Fdiv>\n  <div class=\"tw-panel-body\">\n    <div class=\"tw-section\">\n      <div class=\"tw-label\">Brand persona<\u002Fdiv>\n      <div class=\"tw-radio\" id=\"tw-persona\">\n        <button data-val=\"visa\">\n          <span class=\"tw-swatches\"><span style=\"background:#1A1F71\"><\u002Fspan><span style=\"background:#1434CB\"><\u002Fspan><span style=\"background:#E5E8F8\"><\u002Fspan><\u002Fspan>\n          Visa Trust\n        <\u002Fbutton>\n        <button data-val=\"earth\">\n          <span class=\"tw-swatches\"><span style=\"background:#15543F\"><\u002Fspan><span style=\"background:#2F8F65\"><\u002Fspan><span style=\"background:#E5EFE5\"><\u002Fspan><\u002Fspan>\n          Earthkeeper\n        <\u002Fbutton>\n        <button data-val=\"equinox\">\n          <span class=\"tw-swatches\"><span style=\"background:#3D1A6A\"><\u002Fspan><span style=\"background:#C2185B\"><\u002Fspan><span style=\"background:#F2E5F8\"><\u002Fspan><\u002Fspan>\n          Equinox\n        <\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tw-section\">\n      <div class=\"tw-label\">Surface mood<\u002Fdiv>\n      <div class=\"tw-radio\" id=\"tw-surface\">\n        <button data-val=\"soft\"><span class=\"tw-icn\">▭<\u002Fspan>Soft<\u002Fbutton>\n        <button data-val=\"glass\"><span class=\"tw-icn\">◇<\u002Fspan>Glass<\u002Fbutton>\n        <button data-val=\"paper\"><span class=\"tw-icn\">▤<\u002Fspan>Paper<\u002Fbutton>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tw-section\">\n      <div class=\"tw-label\">Voice<\u002Fdiv>\n      <div class=\"tw-radio\" id=\"tw-voice\">\n        <button data-val=\"institutional\"><span class=\"tw-icn\">◷<\u002Fspan>Institutional<\u002Fbutton>\n        <button data-val=\"activist\"><span class=\"tw-icn\">✦<\u002Fspan>Activist<\u002Fbutton>\n        <button data-val=\"calm\"><span class=\"tw-icn\">❀<\u002Fspan>Calm<\u002Fbutton>\n      <\u002Fdiv>\n      <div class=\"tw-help\">Rewrites the Clarity banner &amp; onboarding headline.<\u002Fdiv>\n    <\u002Fdiv>\n    <div class=\"tw-section\">\n      <div class=\"tw-label\">Demo controls<\u002Fdiv>\n      <button onclick=\"fdResetOnboarding()\" style=\"width:100%;padding:10px;border:1px solid #e5e7eb;background:#fff;border-radius:8px;font-family:inherit;font-size:12px;font-weight:600;color:#1a1a2e;cursor:pointer;\">Reset Fine Dining onboarding<\u002Fbutton>\n      <div class=\"tw-help\">Re-shows the join screen for the Fine Dining Club.<\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<script>\n  const TW_DEFAULTS = /*EDITMODE-BEGIN*/{\n    \"persona\": \"visa\",\n    \"surface\": \"soft\",\n    \"voice\": \"institutional\"\n  }/*EDITMODE-END*/;\n\n  const TW_PERSONAS = {\n    visa:    { b1: '#1A1F71', b2: '#1434CB', tint: '#E5E8F8', tint2: '#DBE2FF' },\n    earth:   { b1: '#15543F', b2: '#2F8F65', tint: '#E5EFE5', tint2: '#D5E8DC' },\n    equinox: { b1: '#3D1A6A', b2: '#C2185B', tint: '#F2E5F8', tint2: '#EDD6F4' }\n  };\n\n  const TW_VOICES = {\n    institutional: {\n      bannerTitle: 'Make your money promote your values.',\n      bannerSub:   'Every transaction is a chance to support what matters to you.',\n      introTitle:  'Make every transaction promote your values.',\n      introSub:    'Your spending can shape what matters. Choose a value you care about, and see how your everyday spending already helps build the world you want to live in.'\n    },\n    activist: {\n      bannerTitle: 'Your money is a vote. Cast it.',\n      bannerSub:   'Every euro takes a side. See where yours lands — and aim it better.',\n      introTitle:  'Spend like the world depends on it.',\n      introSub:    'Pick what you stand for. We\\'ll show you which transactions back it up — and which ones quietly work against it.'\n    },\n    calm: {\n      bannerTitle: 'Spend in line with what you love.',\n      bannerSub:   'Small choices, gently aligned with what matters most to you.',\n      introTitle:  'Your spending, in tune with you.',\n      introSub:    'Choose a value that feels right. We\\'ll quietly show you the moments your everyday spending already moves with it.'\n    }\n  };\n\n  const tw = { ...TW_DEFAULTS };\n\n  function twApplyPersona() {\n    const p = TW_PERSONAS[tw.persona] || TW_PERSONAS.visa;\n    const r = document.documentElement.style;\n    r.setProperty('--tw-brand-1', p.b1);\n    r.setProperty('--tw-brand-2', p.b2);\n    r.setProperty('--tw-brand-tint', p.tint);\n    r.setProperty('--tw-brand-tint-2', p.tint2);\n    document.body.classList.add('tw-applied');\n  }\n  function twApplySurface() {\n    document.body.classList.remove('tw-surf-soft','tw-surf-glass','tw-surf-paper');\n    document.body.classList.add('tw-surf-' + tw.surface);\n  }\n  function twApplyVoice() {\n    const v = TW_VOICES[tw.voice] || TW_VOICES.institutional;\n    document.querySelectorAll('[data-tw-text]').forEach(el => {\n      const k = el.getAttribute('data-tw-text');\n      if (v[k]) el.textContent = v[k];\n    });\n  }\n  function twApplyAll() { twApplyPersona(); twApplySurface(); twApplyVoice(); twSyncButtons(); }\n\n  function twSyncButtons() {\n    [['tw-persona','persona'],['tw-surface','surface'],['tw-voice','voice']].forEach(([id,key]) => {\n      document.querySelectorAll('#'+id+' button').forEach(b => {\n        b.classList.toggle('active', b.dataset.val === tw[key]);\n      });\n    });\n  }\n\n  function twSet(key, val) {\n    tw[key] = val;\n    twApplyAll();\n    try {\n      window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [key]: val } }, '*');\n    } catch(e){}\n  }\n\n  // Wire up clicks\n  document.querySelectorAll('#tw-persona button').forEach(b => b.onclick = () => twSet('persona', b.dataset.val));\n  document.querySelectorAll('#tw-surface button').forEach(b => b.onclick = () => twSet('surface', b.dataset.val));\n  document.querySelectorAll('#tw-voice button').forEach(b => b.onclick = () => twSet('voice', b.dataset.val));\n\n  function twOpen()  { document.getElementById('tw-panel').classList.add('tw-open'); }\n  function twClose() {\n    document.getElementById('tw-panel').classList.remove('tw-open');\n    try { window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*'); } catch(e){}\n  }\n\n  // Edit-mode protocol — listener FIRST, then announce\n  window.addEventListener('message', (e) => {\n    const t = e.data && e.data.type;\n    if (t === '__activate_edit_mode')   twOpen();\n    if (t === '__deactivate_edit_mode') document.getElementById('tw-panel').classList.remove('tw-open');\n  });\n  try { window.parent.postMessage({ type: '__edit_mode_available' }, '*'); } catch(e){}\n\n  // Initial apply\n  twApplyAll();\n<\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
